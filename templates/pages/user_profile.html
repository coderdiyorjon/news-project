{% extends 'news/base.html' %}
{% load static %}

{% block title %}Foydalanuvchi Profili{% endblock title %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-7 col-lg-6">

    <div class="card shadow-lg border-0 rounded-4 p-4">
      <h3 class="mb-1 text-center fw-bold">
        Xush kelibsiz, {{ user.username }}
      </h3>
      <p class="text-center text-muted mb-4">
        Siz haqingizdagi maʼlumotlar quyida keltirilgan
      </p>

      <div class="mb-3">
        <label class="fw-semibold mb-1">Username</label>
        <input type="text" class="form-control" value="{{ user.username }}" readonly placeholder="John Doe">
      </div>

      <div class="mb-3">
        <label class="fw-semibold mb-1">Email manzilingiz</label>
        <input type="text" class="form-control" value="{{ user.email }}" readonly placeholder="John Doe">
      </div>

      <div class="mb-3">
        <label class="fw-semibold mb-1">Ismingiz</label>
        <input type="text" class="form-control" value="{{ user.first_name }}" readonly placeholder="John Doe">
      </div>

      <div class="mb-3">
        <label class="fw-semibold mb-1">Familiyangiz</label>
        <input type="text" class="form-control" value="{{ user.last_name }}" readonly placeholder="John Doe">
      </div>

        <div class="d-flex justify-content-between mt-4">
        <a href="{% url 'index' %}" class="btn btn-secondary">
          <i class="bi me-2"></i> Parolni Almashtirish
        </a>
      </div>

      <div class="d-flex justify-content-between mt-4">
        <a href="{% url 'index' %}" class="btn btn-secondary">
          <i class="bi bi-arrow-left me-2"></i> Orqaga
        </a>

        <a href="{% url 'logout' %}" class="btn btn-danger">
          <i class="bi bi-box-arrow-right me-2"></i> Chiqish
        </a>
      </div>

    </div>

  </div>
</div>

{% endblock content %}

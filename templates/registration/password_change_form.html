{% extends 'news/base.html' %}
{% load static %}

{% block title %}Parolni o'zgartirish{% endblock title %}

{% block content %}

<style>
    .password-card {
        max-width: 450px;
        margin: 40px auto;
        background: #ffffff;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 0 15px rgba(0,0,0,0.08);
        font-family: "Segoe UI", sans-serif;
    }
    .password-card h1 {
        font-size: 22px;
        margin-bottom: 15px;
        text-align: center;
    }
    .password-card p {
        color: #444;
        margin-bottom: 20px;
        text-align: center;
    }
    .password-card form p {
        margin-bottom: 15px;
    }
    .password-card input {
        width: 100%;
        border: 1px solid #ccc;
        padding: 8px 12px;
        border-radius: 6px;
        outline: none;
        box-sizing: border-box;
    }
    .password-card input:focus {
        border-color: #007bff;
    }
    .password-card button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        border: none;
        font-size: 14px;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
    }
    .password-card button:hover {
        background: #0056b3;
    }
</style>

<div class="password-card">
    <h1>Parolni o'zgartirish</h1>
    <p>Parolingizni yangilash uchun quyidagi formani to‘ldiring.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <p>
            <button type="submit">Parolni Almashtirish</button>
        </p>
    </form>
</div>

{% endblock content %}
